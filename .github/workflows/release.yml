name: Release

# Stable release:    git tag v0.2.1  (even minor)
# Pre-release:       git tag v0.3.1-beta.1  (odd minor, -suffix)
#
# VS Code convention: even minor = stable, odd minor = pre-release.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

jobs:
  release:
    name: Build & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Detect pre-release
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == *"-"* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Type-check
        run: bun run check

      - name: Test
        run: bun run test

      - name: Build (production)
        run: bun run build:prod

      - name: Package VSIX
        run: |
          if [[ "${{ steps.meta.outputs.prerelease }}" == "true" ]]; then
            bunx vsce package --no-dependencies --pre-release
          else
            bunx vsce package --no-dependencies
          fi

      - name: Get VSIX filename
        id: vsix
        run: echo "file=$(ls *.vsix)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.vsix.outputs.file }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true

      - name: Publish to VS Marketplace (stable)
        if: steps.meta.outputs.prerelease == 'false'
        run: bunx vsce publish --no-dependencies --packagePath ${{ steps.vsix.outputs.file }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to VS Marketplace (pre-release)
        if: steps.meta.outputs.prerelease == 'true'
        run: bunx vsce publish --no-dependencies --pre-release --packagePath ${{ steps.vsix.outputs.file }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
